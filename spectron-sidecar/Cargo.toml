[package]
name = "spectron-sidecar"
version = "0.1.0"
edition = "2021"
description = "Companion UI for Exult: listens for game events and talks to Spectron"
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["json"] }
eframe = { version = "0.31", default-features = true, features = ["default_fonts", "glow"] }
egui = "0.31"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
