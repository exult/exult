name: ci-macos

on:
  push:
    paths:
      - "**"
      - "!android/**"
      - "!docs/**"
      - "docs/Makefile.am"
      - "!ios/**"
      - "!msvcstuff/**"
      - "!win32/**"
      - "!AUTHORS"
      - "!ChangeLog"
      - "!COPYING"
      - "!FAQ"
      - "!INSTALL"
      - "!NEWS"
      - "!**README**"
      - "!**.ico"
      - "!**.md"
      - "!**.png"
      - "!**.txt"
      - "!.clang*"
      - "!.gitignore"
      - "!.gitattributes"
      - "!.github/workflows/*"
      - ".github/workflows/ci-macos.yml"
  pull_request:
    paths:
      - "**"
      - "!android/**"
      - "!docs/**"
      - "docs/Makefile.am"
      - "!ios/**"
      - "!msvcstuff/**"
      - "!win32/**"
      - "!AUTHORS"
      - "!ChangeLog"
      - "!COPYING"
      - "!FAQ"
      - "!INSTALL"
      - "!NEWS"
      - "!**README**"
      - "!**.ico"
      - "!**.md"
      - "!**.png"
      - "!**.txt"
      - "!.clang*"
      - "!.gitignore"
      - "!.gitattributes"
      - "!.github/workflows/*"
      - ".github/workflows/ci-macos.yml"

jobs:
  ci-macos:
    runs-on: macos-latest
    steps:
      - name: Install dependencies
        run: |
          brew update
          brew upgrade || true
          brew install automake libtool pkg-config libpng zlib libogg libvorbis fluid-synth freetype gtk+3 libxml2 bison flex
          brew install sdl3 sdl3_image icu4c mt32emu autoconf-archive
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Run autoreconf
        run: |
          autoreconf -v -i
      - name: Configure
        run: |
          export LDFLAGS="-L$(brew --prefix bison)/lib -L$(brew --prefix flex)/lib -L$(brew --prefix zlib)/lib"
          export CPPFLAGS="-I$(brew --prefix flex)/include -I$(brew --prefix zlib)/include"
          export PATH="$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$(brew --prefix libxml2)/bin:$PATH"
          export PKG_CONFIG_PATH="$(brew --prefix zlib)/lib/pkgconfig:$(brew --prefix libxml2)/lib/pkgconfig:$(brew --prefix icu4c)/lib/pkgconfig"
          ./configure --with-debug=extreme --enable-exult-studio --enable-exult-studio-support --enable-compiler \
            --enable-zip-support --enable-shared --enable-shp-thumbnailer --enable-data --enable-mods --enable-aseprite-plugin \
            --disable-alsa --disable-timidity-midi
      - name: Build
        run: |
          export LDFLAGS="-L$(brew --prefix bison)/lib -L$(brew --prefix flex)/lib -L$(brew --prefix zlib)/lib"
          export CPPFLAGS="-I$(brew --prefix flex)/include -I$(brew --prefix zlib)/include"
          export PATH="$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$(brew --prefix libxml2)/bin:$PATH"
          export PKG_CONFIG_PATH="$(brew --prefix zlib)/lib/pkgconfig:$(brew --prefix libxml2)/lib/pkgconfig:$(brew --prefix icu4c)/lib/pkgconfig"
          make -j3
      - name: CPU and Metal scaler conformance
        env:
          SDL_GPU_DRIVER: metal
          SDL_VIDEODRIVER: dummy
        run: |
          python3 - <<'PYMETAL'
          from pathlib import Path
          import re, subprocess, tempfile
          text = Path("imagewin/shaders/scalers_metal.h").read_text()
          with tempfile.TemporaryDirectory() as temporary:
              modules = re.findall(r'inline constexpr char (\w+)\[\]=R"MSL\((.*?)\)MSL";', text, re.S)
              assert len(modules) == 10, "Missing Metal shader assets"
              for name, source in modules:
                  path = Path(temporary) / (name + ".metal")
                  path.write_text(source)
                  subprocess.run(["xcrun", "-sdk", "macosx", "metal", "-std=macos-metal2.1", "-c", str(path), "-o", str(path.with_suffix(".air"))], check=True)
          PYMETAL
          sh imagewin/tests/run_gpu_tests.sh --allow-no-gpu
  notify:
    if: ${{ always() }}
    needs:
      - ci-macos
    uses: ./.github/workflows/notify.yml
    with:
      build_name: "The Exult macOS build"
      build_result: ${{ needs.ci-macos.result }}
    secrets:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
